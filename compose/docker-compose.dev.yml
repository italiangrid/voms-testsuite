volumes:
  trustanchors:
  cabundle:
  hostcerts:
  usercerts:
  voms-src:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${VOMS_SRC}

services:

  trust:
    build:
      context: ../docker/trust
      dockerfile: Dockerfile
    volumes:
      - trustanchors:/trust-anchors
      - cabundle:/etc/pki
      - hostcerts:/hostcerts
      - usercerts:/usercerts

  db:
    image: mariadb:10.11.2

    volumes:
      - ./assets/db:/home/mysql/
      - ./assets/scripts:/scripts/

    environment:
      - MYSQL_ROOT_PASSWORD=pwd
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pwd

  testsuite:
    image: ${TS_IMAGE}
    init: true

    environment:
      - TZ=Europe/Rome
      - ROBOT_OPTIONS

    volumes:
      - voms-src:/voms-src:ro
      - ..:/home/test/voms-testsuite
      - trustanchors:/etc/grid-security/certificates
      - ./assets/vomses:/etc/vomses
      - ./assets/vomsdir:/etc/grid-security/vomsdir:ro
      - ./assets/scripts:/scripts
      - usercerts:/usercerts

    command: ["sleep", "infinity"]

  voms:
    image: ${VOMS_IMAGE}
    init: true

    environment:
      TZ: Europe/Rome
      VOMS_HOST: voms.test.example

    volumes:
      - voms-src:/voms-src:ro
      - hostcerts:/hostcerts
      - trustanchors:/etc/grid-security/certificates
      - ./assets/scripts:/scripts
      - ./assets/vomsdir/:/etc/grid-security/vomsdir
      - ./assets/conf/vo.0.conf:/etc/voms/vo.0/voms.conf
      - ./assets/conf/vo.1.conf:/etc/voms/vo.1/voms.conf

    command: ["sleep", "infinity"]

    ports:
      - "15000:15000"
      - "15001:15001"

    privileged: true

    networks:
      default:
        aliases:
          - voms.test.example


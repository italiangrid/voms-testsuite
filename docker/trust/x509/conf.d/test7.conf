[ test7 ]

default_bits           = 2048
default_keyfile        = ${ENV::CA_NAME}/certs/test7.key.pem
distinguished_name     = test7_dn
prompt                 = no
output_password        = pass
default_md             = sha512
x509_extensions        = test7_extensions

[ test7_dn ]

C                      = IT
O                      = IGI
CN                     = Test7

[ test7_extensions ]

basicConstraints       = critical,CA:FALSE
subjectKeyIdentifier   = hash
keyUsage               = critical, nonRepudiation, digitalSignature, keyEncipherment
authorityKeyIdentifier = keyid, issuer
subjectAltName         = email:test7@cnaf.infn.it